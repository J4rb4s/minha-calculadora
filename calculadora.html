<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Aprovação</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #003b73, #0077b6);
        }

        .calculadora {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            color: #0066a1;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            color: #222;
            margin: 5px 0 25px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            outline: none;
        }

        input:focus {
            border-color: #0077b6;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #0077b6;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #005f8f;
        }

        .limpar {
            margin-top: 10px;
            background: #777;
        }

        .limpar:hover {
            background: #555;
        }

        #resultado {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .aprovado {
            display: block !important;
            background: #e8f8ee;
            border: 2px solid #28a745;
            color: #176b2c;
        }

        .reprovado {
            display: block !important;
            background: #fdeaea;
            border: 2px solid #dc3545;
            color: #8b1e29;
        }

        .final {
            display: block !important;
            background: #fff7df;
            border: 2px solid #f0ad00;
            color: #765400;
        }

        .status {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .media {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .nota-final {
            font-size: 28px;
            font-weight: bold;
            margin: 12px 0;
        }

        .formula {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255,255,255,0.7);
            border-radius: 8px;
            font-family: monospace;
        }

        .erro {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="calculadora">

    <div class="logo">UNINASSAU</div>

    <h1>Calculadora de Aprovação</h1>

    <div class="campo">
        <label for="nota1">Nota 1</label>
        <input
            type="number"
            id="nota1"
            min="0"
            max="10"
            step="0.01"
            placeholder="Digite a primeira nota"
        >
    </div>

    <div class="campo">
        <label for="nota2">Nota 2</label>
        <input
            type="number"
            id="nota2"
            min="0"
            max="10"
            step="0.01"
            placeholder="Digite a segunda nota"
        >
    </div>

    <button onclick="calcular()">
        CALCULAR
    </button>

    <button class="limpar" onclick="limpar()">
        LIMPAR
    </button>

    <div id="resultado"></div>

</div>

<script>

function calcular() {

    const nota1 = parseFloat(document.getElementById("nota1").value);
    const nota2 = parseFloat(document.getElementById("nota2").value);
    const resultado = document.getElementById("resultado");

    // Verifica se as notas foram preenchidas
    if (isNaN(nota1) || isNaN(nota2)) {

        resultado.className = "reprovado";

        resultado.innerHTML = `
            <div class="status">⚠️ Atenção</div>
            <p>Digite as duas notas para realizar o cálculo.</p>
        `;

        return;
    }

    // Verifica se as notas estão entre 0 e 10
    if (
        nota1 < 0 || nota1 > 10 ||
        nota2 < 0 || nota2 > 10
    ) {

        resultado.className = "reprovado";

        resultado.innerHTML = `
            <div class="status">⚠️ Nota inválida</div>
            <p>As notas devem estar entre 0 e 10.</p>
        `;

        return;
    }

    // Calcula a Média Parcial
    const media = (nota1 + nota2) / 2;

    // REPROVADO DIRETO
    if (media < 4) {

        resultado.className = "reprovado";

        resultado.innerHTML = `
            <div class="status">
                ❌ Reprovado direto
            </div>

            <div class="media">
                Média: <strong>${formatar(media)}</strong>
            </div>

            <p>
                Sua média ficou abaixo de 4,0.
            </p>
        `;

        return;
    }

    // APROVADO
    if (media >= 7) {

        resultado.className = "aprovado";

        resultado.innerHTML = `
            <div class="status">
                ✅ Aprovado
            </div>

            <div class="media">
                Média: <strong>${formatar(media)}</strong>
            </div>

            <p>
                Parabéns! Você foi aprovado.
            </p>
        `;

        return;
    }

    // PROVA FINAL
    const notaNecessaria = 10 - media;

    resultado.className = "final";

    resultado.innerHTML = `
        <div class="status">
            📝 Precisará fazer a prova final
        </div>

        <div class="media">
            Média: <strong>${formatar(media)}</strong>
        </div>

        <p>
            Você precisará tirar pelo menos:
        </p>

        <div class="nota-final">
            ${formatar(notaNecessaria)}
        </div>

        <p>
            na prova final para ser aprovado.
        </p>

        <div class="formula">
            PF mínima = 10 - ${formatar(media)}
            = ${formatar(notaNecessaria)}
        </div>
    `;
}


// Formata números usando vírgula
function formatar(numero) {
    return numero.toFixed(2).replace(".", ",");
}


// Limpa os campos
function limpar() {

    document.getElementById("nota1").value = "";
    document.getElementById("nota2").value = "";

    const resultado = document.getElementById("resultado");

    resultado.style.display = "none";
    resultado.innerHTML = "";
    resultado.className = "";
}

</script>

</body>
</html>
```
