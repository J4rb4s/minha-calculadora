<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de IMC online</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .descricao {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #resultado {
            margin-top: 25px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .imc {
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0;
        }

        .classificacao {
            font-size: 18px;
            font-weight: bold;
        }

        .aviso {
            margin-top: 25px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Calculadora de IMC</h1>

        <p class="descricao">
            Informe seu peso e sua altura para calcular o Índice de Massa Corporal.
        </p>

        <label for="peso">Peso (kg)</label>
        <input
            type="number"
            id="peso"
            placeholder="Ex.: 70"
            step="0.1"
        >

        <label for="altura">Altura (m)</label>
        <input
            type="number"
            id="altura"
            placeholder="Ex.: 1.75"
            step="0.01"
        >

        <button onclick="calcularIMC()">
            Calcular IMC
        </button>

        <div id="resultado">
            <div>Seu IMC é:</div>

            <div class="imc" id="valorIMC"></div>

            <div class="classificacao" id="classificacao"></div>
        </div>

        <div class="aviso">
            O IMC é apenas um indicador geral e não substitui uma avaliação profissional.
        </div>

    </div>

    <script>

        function calcularIMC() {

            const peso = parseFloat(document.getElementById("peso").value);
            const altura = parseFloat(document.getElementById("altura").value);

            if (!peso || !altura || peso <= 0 || altura <= 0) {

                alert("Digite um peso e uma altura válidos.");

                return;
            }

            const imc = peso / (altura * altura);

            let classificacao;

            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
            }
            else if (imc < 25) {
                classificacao = "Peso normal";
            }
            else if (imc < 30) {
                classificacao = "Sobrepeso";
            }
            else {
                classificacao = "Obesidade";
            }

            document.getElementById("valorIMC").textContent =
                imc.toFixed(2);

            document.getElementById("classificacao").textContent =
                classificacao;

            document.getElementById("resultado").style.display = "block";
        }

    </script>

</body>
</html>
