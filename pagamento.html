<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pagamento PIX</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        .valor {
            font-size: 35px;
            font-weight: bold;
            color: #168f4d;
            margin: 25px 0;
        }

        #qrCode {
            width: 280px;
            height: 280px;
            max-width: 100%;
            display: none;
            margin: 20px auto;
        }

        .carregando {
            padding: 30px;
            color: #666;
        }

        .pix-area {
            margin-top: 25px;
            text-align: left;
        }

        .pix-area label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #pixCode {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #168f4d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #10733d;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #fff7d6;
            color: #705d00;
        }

        .sucesso {
            background: #e8f8ee;
            color: #14743d;
        }

        .erro {
            background: #fdeaea;
            color: #a52222;
        }

        .instrucoes {
            margin-top: 25px;
            text-align: left;
            line-height: 1.6;
            color: #555;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Pagamento PIX</h1>

        <p>
            Faça o pagamento para liberar
            o acesso à calculadora.
        </p>

        <div class="valor">
            R$ 5,00
        </div>


        <div
            id="carregando"
            class="carregando"
        >
            Gerando seu PIX...
        </div>


        <img
            id="qrCode"
            alt="QR Code PIX"
        >


        <div
            id="pixArea"
            class="pix-area"
            style="display:none;"
        >

            <label>
                PIX Copia e Cola
            </label>

            <input
                id="pixCode"
                type="text"
                readonly
            >

            <button onclick="copiarPix()">
                Copiar código PIX
            </button>

        </div>


        <div
            id="status"
            class="status"
        >
            Aguardando pagamento...
        </div>


        <div class="instrucoes">

            <strong>Como pagar:</strong>

            <ol>

                <li>
                    Abra o aplicativo do seu banco.
                </li>

                <li>
                    Escolha PIX.
                </li>

                <li>
                    Escaneie o QR Code.
                </li>

                <li>
                    Confira o valor e confirme.
                </li>

                <li>
                    Aguarde a confirmação.
                </li>

            </ol>

        </div>

    </div>

</div>


<script>

let pagamentoId = null;


/*
    Cria o pagamento
*/

async function criarPagamento() {

    try {

        const resposta = await fetch(
            "/criar-pagamento",
            {
                method: "POST"
            }
        );


        const dados = await resposta.json();


        console.log(
            "Resposta do servidor:",
            dados
        );


        if (!resposta.ok) {

            throw new Error(
                dados.erro ||
                "Erro ao criar pagamento."
            );

        }


        pagamentoId =
            dados.pagamentoId;


        /*
            QR CODE
        */

        const qrCode =
            document.getElementById(
                "qrCode"
            );


        qrCode.src =
            "data:image/png;base64," +
            dados.qrCode;


        qrCode.style.display =
            "block";


        /*
            Esconder carregamento
        */

        document.getElementById(
            "carregando"
        ).style.display =
            "none";


        /*
            PIX COPIA E COLA
        */

        document.getElementById(
            "pixCode"
        ).value =
            dados.pixCopiaECola;


        document.getElementById(
            "pixArea"
        ).style.display =
            "block";


        /*
            Atualizar status
        */

        document.getElementById(
            "status"
        ).innerText =
            "Aguardando pagamento...";


        verificarPagamento();


    } catch (erro) {

        console.error(
            erro
        );


        document.getElementById(
            "carregando"
        ).style.display =
            "none";


        const status =
            document.getElementById(
                "status"
            );


        status.innerText =
            "Não foi possível gerar o PIX.";


        status.className =
            "status erro";

    }

}


/*
    Copiar PIX
*/

function copiarPix() {

    const campo =
        document.getElementById(
            "pixCode"
        );


    navigator.clipboard
        .writeText(
            campo.value
        )
        .then(() => {

            const status =
                document.getElementById(
                    "status"
                );


            status.innerText =
                "Código PIX copiado!";


            status.className =
                "status sucesso";

        });

}


/*
    Verificar pagamento
*/

async function verificarPagamento() {

    if (!pagamentoId) {
        return;
    }


    try {

        const resposta =
            await fetch(
                "/verificar-pagamento/" +
                pagamentoId
            );


        const dados =
            await resposta.json();


        console.log(
            "Status do pagamento:",
            dados
        );


        if (dados.pago === true) {

            const status =
                document.getElementById(
                    "status"
                );


            status.innerText =
                "Pagamento confirmado!";


            status.className =
                "status sucesso";


            setTimeout(() => {

                window.location.href =
                    "/calculadora.html";

            }, 1500);


            return;

        }


    } catch (erro) {

        console.error(
            "Erro verificando pagamento:",
            erro
        );

    }


    /*
        Tenta novamente em 3 segundos.
    */

    setTimeout(
        verificarPagamento,
        3000
    );

}


/*
    Iniciar
*/

criarPagamento();

</script>

</body>

</html>
